name: Daten aktualisieren

on:
  schedule:
    - cron: "*17/47 * * * *"   # alle 30 Minuten
  workflow_dispatch:          # zusätzlich manuell startbar

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Daten abrufen
        run: node scripts/fetch-data.mjs
      - name: data.json speichern
        run: |
          git config user.name "cockpit-bot"
          git config user.email "cockpit-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Daten aktualisiert" && git push)
